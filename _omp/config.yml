providers:
  tts: xai
disabledProviders:
  - claude
extensions:
  - ~/.omp/agent/extensions/deepinfra.ts
  - ~/.omp/agent/extensions/thinking-shortcuts.ts
symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 1
steeringMode: all
followUpMode: all
autocompleteMaxVisible: 20
edit:
  mode: hashline
bash:
  autoBackground:
    enabled: true
astGrep:
  enabled: true
computer:
  enabled: false
checkpoint:
  enabled: false
plan:
  enabled: false
modelRoles:
  smol: openai-codex/gpt-5.6-luna:xhigh
  slow: openai-codex/gpt-5.6-sol:medium
  vision: openai-codex/gpt-5.6-terra:medium
  plan: openai-codex/gpt-5.6-terra:high
  designer: openai-codex/gpt-5.6-terra:high
  commit: openai-codex/gpt-5.6-luna:xhigh
  tiny: openai-codex/gpt-5.6-luna:low
  advisor: openai-codex/gpt-5.6-luna:xhigh
  Oracle: openai-codex/gpt-5.6-sol:high
  reviewer: openai-codex/gpt-5.6-terra:high
  default: openai-codex/gpt-5.6-luna:xhigh
  cursork3: cursor/kimi-k3-high:high
  completeness: xai-oauth/grok-4.6:medium
defaultThinkingLevel: auto
compaction:
  thresholdPercent: 40
  idleEnabled: true
  idleThresholdTokens: 200000
startup:
  quiet: true
  showSplash: false
lsp:
  enabled: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
cycleOrder:
  - smol
  - default
  - slow
advisor:
  enabled: true
dev:
  autoqaConsent: granted
