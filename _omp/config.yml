providers:
  {}
disabledProviders:
  - claude
extensions:
  - ~/.omp/agent/extensions/deepinfra.ts
  - ~/.omp/agent/extensions/thinking-shortcuts.ts
symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 1
steeringMode: all
followUpMode: all
autocompleteMaxVisible: 20
edit:
  mode: apply_patch
bash:
  autoBackground:
    enabled: true
astGrep:
  enabled: true
computer:
  enabled: false
checkpoint:
  enabled: false
plan:
  enabled: false
modelRoles:
  smol: openai-codex/gpt-5.6-luna:xhigh
  slow: openai-codex/gpt-5.6-sol:medium
  vision: openai-codex/gpt-5.6-terra:medium
  plan: openai-codex/gpt-5.6-terra:high
  designer: openai-codex/gpt-5.6-terra:high
  commit: openai-codex/gpt-5.6-luna:xhigh
  tiny: openai-codex/gpt-5.6-luna:low
  advisor: opencode-zen/deepseek-v4-flash:high
  reviewer: openai-codex/gpt-5.6-terra:medium
  # OMP Lite keeps implementation, scoped review, and PM outcome review in
  # the driving session. Pin that session's default to the delivery runtime.
  default: openai-codex/gpt-5.6-luna:xhigh
  Oracle: openai-codex/gpt-5.6-sol:xhigh
  Trouble: xai/grok-4.5:high
defaultThinkingLevel: auto
compaction:
  thresholdPercent: 40
  idleEnabled: true
  idleThresholdTokens: 200000
startup:
  quiet: true
  showSplash: false
lsp:
  enabled: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
cycleOrder:
  - smol
  - default
  - slow
  - Trouble
