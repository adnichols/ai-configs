providers:
  openai-codex:
    name: OpenAI Codex (local CLI Proxy API)
    baseUrl: http://127.0.0.1:8318/v1
    api: openai-completions
    apiKey: local-cliproxyapi
    headers:
      User-Agent: codex-tui/0.142.5 (Linux; x86_64)
      Originator: codex-tui
    compat:
      supportsDeveloperRole: true
      supportsReasoningEffort: true
      supportsUsageInStreaming: true
    models:
      - id: gpt-5.6-luna
        name: GPT-5.6 Luna (CLI Proxy API)
        reasoning: true
        input: [text, image]
        cost:
          input: 1
          output: 6
          cacheRead: 0.1
          cacheWrite: 1.25
        contextWindow: 372000
        maxTokens: 128000
      - id: gpt-5.6-sol
        name: GPT-5.6 Sol (CLI Proxy API)
        reasoning: true
        input: [text, image]
        cost:
          input: 5
          output: 30
          cacheRead: 0.5
          cacheWrite: 6.25
        contextWindow: 372000
        maxTokens: 128000
      - id: gpt-5.6-terra
        name: GPT-5.6 Terra (CLI Proxy API)
        reasoning: true
        input: [text, image]
        cost:
          input: 2.5
          output: 15
          cacheRead: 0.25
          cacheWrite: 3.125
        contextWindow: 372000
        maxTokens: 128000
