# Managed by ai-configs/kitty/install.sh.

# Keep local selections and remote OSC 52 copies available on the macOS clipboard.
copy_on_select clipboard
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Upload a clipboard image to the host detected from the active remote pane and
# insert the resulting remote path into the prompt.
map cmd+shift+v launch --type=overlay --allow-remote-control ${HOME}/.local/bin/kitty-paste-image-to-ssh
map ctrl+alt+v launch --type=overlay --allow-remote-control ${HOME}/.local/bin/kitty-paste-image-to-ssh

# One-window entry points for the two remote Herdr environments.
map cmd+shift+1 launch --type=os-window --os-window-title "mbp · Herdr" kitten ssh mbp -t /Users/anichols/.local/bin/herdr-kitty
map cmd+shift+2 launch --type=os-window --os-window-title "dever · Herdr" kitten ssh dever -t /home/anichols/.local/bin/herdr-kitty
map cmd+alt+1 launch --type=os-window --os-window-title "mbp · shell" kitten ssh mbp
map cmd+alt+2 launch --type=os-window --os-window-title "dever · shell" kitten ssh dever
